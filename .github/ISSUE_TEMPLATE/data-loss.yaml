name: Possible data loss
description: >-
  Missing, duplicated, or incorrectly retained/restored memories; backup,
  forget/undo, or outbox behavior that lost or threatened data.
title: "[data-loss] "
labels: ["data-loss"]
body:
  - type: markdown
    attributes:
      value: |
        **Never include** in this issue: credentials, tokens, backend URLs
        containing credentials, configuration files, raw session
        transcripts, or stored memory contents. Replace real content with
        placeholders such as `<REDACTED>` and describe *what kind* of
        content was affected, not its contents.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What data was lost, duplicated, or unexpectedly retained?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Pending outbox / delivery during backend outage
        - Extraction (observations missing or wrong)
        - Forgetting (/kiwifs-forget, /kiwifs-forget-undo)
        - Backup (/kiwifs-backup-verify) or export
        - Downgrade/rollback/upgrade behavior
        - Board cleanup (/kiwifs-board-cleanup, /kiwifs-board-gc)
        - Other (describe below)
    validations:
      required: true
  - type: dropdown
    id: recoverable
    attributes:
      label: Is the data currently recoverable?
      options:
        - "Yes — pending outbox, backup, or undo covers it"
        - Partially
        - "No"
        - Unknown
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Extension commit or version, Pi version, Node.js version, KiwiFS backend version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (sanitized)
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: >-
        Log excerpts with credentials, tokens, URLs with credentials, and
        memory contents removed. `/kiwifs-queue` and `/kiwifs-status`
        output is fine if redacted; do not paste full transcripts.
  - type: checkboxes
    id: attestation
    attributes:
      label: Sanitization attestation
      options:
        - label: >-
            This report contains no credentials, tokens, config files,
            raw transcripts, stored memory contents, or credentialed
            backend URLs.
          required: true
